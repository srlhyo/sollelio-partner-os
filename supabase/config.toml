# Sollelio Partner OS — local Supabase stack.
#
# Partner OS has its own Supabase project, separate from Sollelio Events V1
# (04_TECHNICAL_ARCHITECTURE.md §3). `project_id` names the local stack only;
# staging and production are linked with `supabase link --project-ref <ref>`.

project_id = "sollelio-partner-os"

# Local ports sit in the 544xx range rather than Supabase's 543xx defaults, so this
# stack coexists with other local Supabase projects on the same machine instead of
# fighting them for 54321/54322.

[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54423

[inbucket]
enabled = true
port = 54424

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
# Wildcarded so a deep link — the exact Request or Resource the partner was opening —
# survives the round trip through email (03_UX_SPEC.md §20).
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  # The preview server the browser E2E suite runs against.
  "http://127.0.0.1:4173/**",
  "http://localhost:4173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

# Magic link / email OTP only — partners never manage a password
# (04_TECHNICAL_ARCHITECTURE.md §20).
#
# `enable_signup` here is the email *provider* switch, not a signup-only one:
# turning it off returns "Email logins are disabled" and breaks the only way into
# Partner OS. Self-signup is prevented by `[auth] enable_signup = false` above and by
# the client passing `shouldCreateUser: false`, so people still arrive invite-first.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 900
# Local only. GoTrue refuses a second link to the same address within
# `max_frequency` — one minute by default, which is right in production and far too
# long for a browser suite that signs the same person out and back in. One second is
# enough for that, and short enough to wait for explicitly where a test needs to.
# Remote projects are governed by their own dashboard settings, never by this file.
max_frequency = "1s"

# Local only, same reasoning. GoTrue also caps how many emails the whole instance
# sends per hour (30 by default), which repeated runs of the browser suite exceed —
# it signs several people in many times over, and the counter outlives a single run.
# Remote projects keep their own dashboard limits; nothing here reaches them.
[auth.rate_limit]
email_sent = 3600

[edge_runtime]
enabled = true
policy = "oneshot"

[storage]
enabled = true
file_size_limit = "50MiB"
