name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.partner-os.invalid
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_APP_ENV: staging

      # Release-blocking: the service-role credential must never reach the browser
      # (04_TECHNICAL_ARCHITECTURE.md §7).
      - name: No privileged secrets in the client bundle
        run: npm run check:client-bundle

  migrations:
    name: Migrations are reproducible
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply every migration to an empty database
        run: node scripts/verify-migrations.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  edge-functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check
        shell: bash
        run: |
          shopt -s globstar
          deno check supabase/functions/**/*.ts
