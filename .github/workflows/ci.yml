name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.partner-os.invalid
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_APP_ENV: staging

      # Release-blocking: the service-role credential must never reach the browser
      # (04_TECHNICAL_ARCHITECTURE.md §7).
      - name: No privileged secrets in the client bundle
        run: npm run check:client-bundle

  database:
    name: Migrations, posture and RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Applies every migration to an empty database, then runs the baseline posture
      # checks and the release-blocking authorization assertions
      # (06_BUILD_PLAN.md, "Release-blocking security tests").
      - name: Migrations, security posture and RLS
        run: node scripts/verify-migrations.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  edge-functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check
        shell: bash
        run: |
          shopt -s globstar
          deno check --config supabase/functions/deno.json supabase/functions/**/*.ts

  e2e:
    name: Browser E2E (real Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Real GoTrue, real PostgREST, real RLS. The suite signs in through the
      # genuine magic-link flow, reading the message out of the local mail catcher.
      - name: Start the local Supabase stack
        run: supabase start

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
